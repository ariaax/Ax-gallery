name: Inspect mpv lib (temporary)
on:
  push:
    branches: [wip/mpv-inspect]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and inspect AAR
        run: |
          V=0.1.12
          curl -sfL -o lib.aar "https://repo1.maven.org/maven2/io/github/abdallahmehiz/mpv-android-lib/$V/mpv-android-lib-$V.aar"
          mkdir x && cd x && unzip -q ../lib.aar && mkdir c && cd c && unzip -q ../classes.jar && cd ..
          echo "=== TOP-LEVEL CLASSES ==="
          find c -name '*.class' | grep -v '\$' | sed 's/^c\///;s/\.class$//;s/\//./g'
          echo "=== NON-LAMBDA INNER CLASSES ==="
          find c -name '*.class' | grep '\$' | grep -v 'lambda\|inlined\|\$[0-9]' | sed 's/^c\///;s/\.class$//;s/\//./g'
          for k in is.xyz.mpv.MPV 'is.xyz.mpv.MPV$Companion' is.xyz.mpv.MPVNode 'is.xyz.mpv.MPV$PropertyAccessor' 'is.xyz.mpv.MPV$PropertyFlowAccessor' 'is.xyz.mpv.MPV$LogObserver' 'is.xyz.mpv.MPV$EventObserver' is.xyz.mpv.BaseMPVView; do echo "=== $k ==="; javap -p -cp c "$k" 2>&1 | head -150; done
          cat AndroidManifest.xml
