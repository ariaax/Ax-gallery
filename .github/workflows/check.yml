name: Check build (work branches)

# Runs on every branch except main. A change is pushed to a work branch first; only when this check
# is green is it merged into main (which then builds and publishes the signed APK).
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Compile and package (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Gradle
        run: |
          chmod +x gradlew
          if [ -f gradle.properties ]; then
            sed -i '/android.aapt2FromMavenOverride/d' gradle.properties
          fi

      - name: Build release APK (no signing)
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Build 32-bit ARM APK and list its native libs
        run: |
          set -o pipefail
          ./gradlew assembleRelease -Parm32 2>&1 | tee -a build.log
          unzip -l "$(find app/build/outputs/apk/release/ -name '*.apk' | head -n 1)" | grep -E "lib/|\.apk" | head -20
          ls -la app/build/outputs/apk/release/

      - name: Where is the glass library (package names)
        if: always()
        run: |
          for f in $(find ~/.gradle /home/runner/.gradle -iname 'liquidglass*' \( -name '*.jar' -o -name '*.aar' \) 2>/dev/null | head -6); do
            echo "== $f"; unzip -l "$f" | awk '{print $4}' | grep -i "class$\|jar$" | head -40
          done
          find ~/.gradle -path '*transforms*' -name 'liquidglass-api.jar' 2>/dev/null | head -2 | while read j; do unzip -l "$j" | awk '{print $4}' | head -60; done

      - name: Show compile errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | sed 's#file:///home/runner/work/[^/]*/[^/]*/##' | head -10 | while IFS= read -r line; do echo "::error::$line"; done
